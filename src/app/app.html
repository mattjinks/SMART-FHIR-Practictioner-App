@if (
  smartSessionService.smartSession();
  as session
) {
  @if (
    session.need_patient_banner &&
    session.patient &&
    smartSessionService.baseUrl()
  ) {
    <app-patient-banner
      [accessToken]="session.access_token"
      [baseUrl]="smartSessionService.baseUrl()!"
      [patientId]="session.patient">
    </app-patient-banner>
  }
}


<main>
  <app-practictioner-launch></app-practictioner-launch>
</main>

<router-outlet />
